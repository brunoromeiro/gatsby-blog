name: Rewrite validation

on:
  push:
    branches:
      - rewrite/nextjs-payload-foundation
  pull_request:
    branches:
      - rewrite/nextjs-payload-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
